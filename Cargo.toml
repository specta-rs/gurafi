[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
license = "MIT"
repository = "https://github.com/specta-rs/gurafi"

[workspace.dependencies]
# First-party crates, these always resolve to the local implementation.
gql = { path = "crates/gql", version = "0.3.0" }
gurafi = { path = "crates/gurafi", version = "0.1.0" }
gurafi-macros = { path = "crates/gurafi-macros", version = "0.1.0" }
suku = { path = "crates/suku", version = "0.1.0" }

# External dependencies
axum = "0.8.4"
futures = "0.3.30"
http = "1.1.0"
indexmap = "2.2.6"
proc-macro2 = "1.0.86"
quote = "1.0.36"
rustc-hash = "2.0.0"
self_cell = "1.3.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
smallvec = "1.13.2"
syn = "2.0.68"
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6.0", features = ["cors", "trace"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
