[package]
name = "suku"
description = "GraphQL over HTTP for Rust"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The GraphQL-over-HTTP specification is the core of this crate and needs no feature flag.
# Everything below is an extension beyond that specification and is opt-in.
default = ["axum"]
axum = ["dep:axum", "dep:tokio", "tokio/sync", "tokio/time"]
# Server-sent-event subscriptions (`Accept: text/event-stream`). A transport extension: the
# GraphQL over HTTP specification does not define subscriptions.
sse = []
# WebSocket subscriptions use the `graphql-transport-ws` protocol, another non-HTTP transport.
ws = ["axum", "axum/ws"]
# GraphQL multipart requests (file uploads). A community specification, not part of GraphQL over
# HTTP. Enabling it adds the `multer` dependency.
multipart = ["dep:multer"]
tracing = ["dep:tracing", "gql/tracing"]
# Serve GraphiQL from React/GraphiQL assets built into the crate instead of the unpkg CDN.
vendored-graphiql = []

[dependencies]
gql.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }

http.workspace = true
bytes = "1.6"
form_urlencoded = "1.2.2"
multer = { version = "3.1", optional = true }

axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tracing-core = "0.1.36"
tokio.workspace = true
serde_urlencoded = "0.7"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
