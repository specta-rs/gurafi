[package]
name = "gurafi"
description = "Intuitive GraphQL server for Rust"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
tracing = ["dep:tracing", "gql/tracing"]

[dependencies]
gql.workspace = true
gurafi-macros.workspace = true
futures.workspace = true
indexmap.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
suku = { workspace = true, default-features = false, features = ["multipart"] }
