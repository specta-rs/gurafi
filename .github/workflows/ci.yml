name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      # `cargo test --workspace` runs an unoptimised build, and its larger frames need more than
      # a 2 MiB worker stack at the parser's depth limit (see `crates/gql/tests/support/stack.rs`).
      # The depth-limit tests only assert the 2 MiB budget in a release build, so check it here.
      - name: Verify the depth-limit stack budget
        run: cargo test --release -p gql --all-features --test review_prepared --test security
